name: Android verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JVM tests, debug APK and Android lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug
